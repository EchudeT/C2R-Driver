    <tspan x="1996" dy="29">制品</tspan>
    <tspan x="1996" dy="29">运行证据</tspan>
    <tspan x="1996" dy="29">逐契约结论</tspan>
  </text>
  <text x="2043" y="552" class="node-note" text-anchor="middle">交付关口</text>

