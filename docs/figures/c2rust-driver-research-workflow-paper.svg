  <text x="1715" y="219" class="phase-en">TRANSLATION &amp; VALIDATION</text>

  <rect x="1515" y="270" width="180" height="310" rx="5" fill="#FFFFFF" stroke="#84ADFF" stroke-width="1.3"/>
  <use href="#i-code" x="1583" y="293" width="44" height="44" style="color:#2E90FA"/>
  <text x="1605" y="365" class="node-title" text-anchor="middle">Rust 实现</text>
  <text x="1605" y="393" class="node-stage" text-anchor="middle">STAGE 14</text>
  <text x="1533" y="432" class="node-body">
    <tspan x="1533" dy="0">驱动状态与数据路径</tspan>
    <tspan x="1533" dy="29">IRQ、并发与恢复</tspan>
    <tspan x="1533" dy="29">测试适配与最小接线</tspan>
    <tspan x="1533" dy="29">目标规范自检</tspan>
  </text>

  <rect x="1720" y="270" width="235" height="310" rx="5" fill="#FFFFFF" stroke="#84ADFF" stroke-width="1.3"/>
  <use href="#i-test" x="1815" y="293" width="44" height="44" style="color:#2E90FA"/>
  <text x="1838" y="365" class="node-title" text-anchor="middle">制品与 QEMU 验证</text>
  <text x="1838" y="393" class="node-stage" text-anchor="middle">STAGES 15–16</text>
  <text x="1742" y="432" class="node-body">
    <tspan x="1742" dy="0">绑定运行制品身份</tspan>
    <tspan x="1742" dy="29">probe → I/O → IRQ</tspan>
    <tspan x="1742" dy="29">边界、恢复与冷启动</tspan>
    <tspan x="1742" dy="29">保存命令、日志和 receipt</tspan>
  </text>

  <rect x="1980" y="270" width="125" height="310" rx="5" fill="#FFFCF5" stroke="#EAAA08" stroke-width="1.5"/>
  <use href="#i-review" x="2021" y="294" width="44" height="44" style="color:#DC6803"/>
