  <text x="70" y="67" class="title">证据门控的 C2Rust 内核驱动迁移方法</text>
  <text x="70" y="101" class="subtitle">Evidence-gated C-to-Rust kernel driver migration with independent AI review and executable validation</text>

  <!-- Compact legend -->
  <circle cx="1550" cy="62" r="7" fill="#2E90FA"/><text x="1568" y="68" class="subtitle">工作者 AI</text>
  <circle cx="1715" cy="62" r="7" fill="#EAAA08"/><text x="1733" y="68" class="subtitle">独立审查 AI</text>
  <circle cx="1930" cy="62" r="7" fill="#12B76A"/><text x="1948" y="68" class="subtitle">程序化验证</text>

  <line x1="70" y1="132" x2="2130" y2="132" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- Inputs -->
  <rect x="70" y="257" width="205" height="390" rx="6" fill="#F9FAFB" stroke="#98A2B3" stroke-width="1.6"/>
  <use href="#i-input" x="92" y="280" width="31" height="31" style="color:#475467"/>
  <text x="136" y="304" class="node-title">研究输入</text>
  <text x="92" y="349" class="node-body">
    <tspan x="92" dy="0">源 C 驱动</tspan>
    <tspan x="92" dy="34">目标内核原版源码</tspan>
    <tspan x="92" dy="34">QEMU 设备模型</tspan>
    <tspan x="92" dy="34">硬件与测试材料</tspan>
    <tspan x="92" dy="34">迁移 Skill 与工具</tspan>
  </text>
  <line x1="92" y1="535" x2="252" y2="535" stroke="#D0D5DD"/>
  <text x="92" y="568" class="node-note">全部输入保留来源、版本</text>
  <text x="92" y="591" class="node-note">和内容哈希</text>

  <!-- Phase I -->
  <rect x="325" y="192" width="330" height="455" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.5"/>
  <rect x="325" y="192" width="330" height="52" rx="6" fill="#F2F4F7"/>
  <path d="M325 238H655" stroke="#98A2B3" stroke-width="1.2"/>
  <text x="345" y="219" class="phase">I　范围与基线</text>
  <text x="536" y="219" class="phase-en">SCOPE</text>
  <use href="#i-lock" x="466" y="278" width="48" height="48" style="color:#475467"/>
  <text x="490" y="360" class="node-title" text-anchor="middle">范围冻结与版本固定</text>
  <text x="490" y="390" class="node-stage" text-anchor="middle">STAGES 01–06</text>
  <text x="352" y="438" class="node-body">
    <tspan x="352" dy="0">• 唯一化设备、驱动与总线</tspan>
    <tspan x="352" dy="32">• 固定包含范围与排除项</tspan>
    <tspan x="352" dy="32">• 锁定 source / target / QEMU commit</tspan>
    <tspan x="352" dy="32">• 建立可复现的迁移 envelope</tspan>
  </text>
  <rect x="352" y="566" width="276" height="48" rx="4" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="490" y="596" class="node-note" text-anchor="middle">输出：不可变范围与上游基线</text>

  <!-- Phase II -->
  <rect x="705" y="192" width="735" height="455" rx="6" fill="#FFFFFF" stroke="#84ADFF" stroke-width="1.5"/>
  <rect x="705" y="192" width="735" height="52" rx="6" fill="#F5F8FF"/>
  <path d="M705 238H1440" stroke="#B2CCFF" stroke-width="1.2"/>
  <text x="725" y="219" class="phase">II　证据与设计</text>
  <text x="932" y="219" class="phase-en">EVIDENCE &amp; DESIGN</text>

  <rect x="730" y="270" width="210" height="310" rx="5" fill="#FFFFFF" stroke="#B2CCFF" stroke-width="1.3"/>
  <use href="#i-evidence" x="813" y="293" width="44" height="44" style="color:#2E90FA"/>
  <text x="835" y="365" class="node-title" text-anchor="middle">证据基础设施</text>
  <text x="835" y="393" class="node-stage" text-anchor="middle">STAGES 07–09</text>
  <text x="750" y="432" class="node-body">
    <tspan x="750" dy="0">最小证据闭包</tspan>
    <tspan x="750" dy="29">来源与缺口登记</tspan>
    <tspan x="750" dy="29">可执行 QEMU 路线</tspan>
    <tspan x="750" dy="29">可追溯知识库</tspan>
  </text>

  <rect x="965" y="270" width="255" height="310" rx="5" fill="#FFFFFF" stroke="#84ADFF" stroke-width="1.3"/>
  <use href="#i-contract" x="1071" y="293" width="44" height="44" style="color:#2E90FA"/>
  <text x="1093" y="365" class="node-title" text-anchor="middle">行为与验证设计</text>
  <text x="1093" y="393" class="node-stage" text-anchor="middle">STAGES 10–12</text>
  <text x="987" y="432" class="node-body">
    <tspan x="987" dy="0">目标 API 与完整调用链</tspan>
    <tspan x="987" dy="29">C 语义与硬件行为契约</tspan>
    <tspan x="987" dy="29">Rust 设计与安全义务</tspan>
    <tspan x="987" dy="29">公开测试与 oracle 映射</tspan>
  </text>

  <rect x="1245" y="270" width="168" height="310" rx="5" fill="#FFFCF5" stroke="#EAAA08" stroke-width="1.5"/>
  <use href="#i-review" x="1307" y="294" width="44" height="44" style="color:#DC6803"/>
  <text x="1329" y="365" class="gate-title" text-anchor="middle">独立审查 I</text>
  <text x="1329" y="391" class="node-stage" text-anchor="middle">STAGE 13</text>
  <text x="1263" y="432" class="gate-body">
    <tspan x="1263" dy="0">核验原始证据</tspan>
    <tspan x="1263" dy="29">检查契约与测试</tspan>
    <tspan x="1263" dy="29">精确引用位置</tspan>
    <tspan x="1263" dy="29">一次列全问题</tspan>
  </text>
  <text x="1329" y="552" class="node-note" text-anchor="middle">设计就绪关口</text>

  <!-- Phase III -->
  <rect x="1490" y="192" width="640" height="455" rx="6" fill="#FFFFFF" stroke="#84ADFF" stroke-width="1.5"/>
  <rect x="1490" y="192" width="640" height="52" rx="6" fill="#F5F8FF"/>
