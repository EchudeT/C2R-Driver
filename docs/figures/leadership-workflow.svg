<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="440" viewBox="0 0 1140 440" role="img" aria-labelledby="title desc">
  <title id="title">OS 驱动翻译的三个阶段</title>
  <desc id="desc">明确翻译对象，理解来源与目标框架，补齐目标能力并完成 Rust 翻译和验证。程序化检查、工作者自检与可选独立复核贯穿流程。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#617283" stroke-width="1.3"/></marker></defs>
  <rect width="1140" height="440" fill="white"/>
  <g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
    <text x="30" y="34" font-size="20" font-weight="600" fill="#233343">明确对象 → 理解框架 → 补全翻译</text>
    <text x="30" y="62" font-size="14" fill="#586776">按任务建立代码与证据路径，将分析结果直接交给实现和验证</text>
    <g fill="#f6f8fa" stroke="#bbc5ce">
      <rect x="30" y="86" width="290" height="276" rx="4"/>
      <rect x="360" y="86" width="390" height="276" rx="4"/>
      <rect x="790" y="86" width="320" height="276" rx="4"/>
    </g>
    <g fill="#233343" font-size="19" font-weight="600">
      <text x="50" y="123">01 明确翻译对象</text>
      <text x="380" y="123">02 理解双方框架</text>
      <text x="810" y="123">03 补全能力并翻译</text>
    </g>
    <g fill="#435465" font-size="15">
      <text x="50" y="162">设备、总线、源码入口消歧</text>
      <text x="50" y="198">确认版本与功能范围</text>
      <text x="50" y="234">获取代码和设备资料</text>
      <text x="50" y="270">准备可执行的实验路线</text>
      <text x="380" y="162">整理核心文件、架构分支与调用路径</text>
      <text x="380" y="198">来源侧：设备行为与 OS 依赖</text>
      <text x="380" y="234">目标侧：接口能力与同类驱动链路</text>
      <text x="380" y="270">建立行为映射、能力缺口与测试约定</text>
      <text x="810" y="162">补齐必要的目标底层接口</text>
      <text x="810" y="198">Rust 翻译与目标系统集成</text>
      <text x="810" y="234">构建、自测与公开运行验证</text>
      <text x="810" y="270">按原因修复，复用有效结果</text>
    </g>
    <g stroke="#ccd5dd"><path d="M50 292H300"/><path d="M380 292H730"/><path d="M810 292H1090"/></g>
    <g fill="#233343" font-size="15" font-weight="600">
      <text x="50" y="324">交付：范围、材料与实验路线</text>
      <text x="380" y="324">交付：翻译方案、缺口与测试计划</text>
      <text x="810" y="324">交付：代码、制品与运行证据</text>
    </g>
    <g stroke="#617283" stroke-width="1.4" fill="none" marker-end="url(#arrow)"><path d="M324 225H354"/><path d="M754 225H784"/></g>
    <text x="30" y="397" font-size="14" fill="#586776">验收机制：程序化事实检查 + 工作者自检 + 可选独立复核</text>
    <text x="30" y="425" font-size="14" fill="#586776">执行基础：知识检索 · 持续会话 · 状态恢复 · 证据留存 · 局部返修 · 成本统计</text>
  </g>
</svg>
